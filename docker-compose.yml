services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-koto}
      POSTGRES_USER: ${POSTGRES_USER:-koto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-koto}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-koto} -d ${POSTGRES_DB:-koto}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-koto}:${POSTGRES_PASSWORD:-koto}@database:5432/${POSTGRES_DB:-koto}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-5}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-3600}
      DISCOVERY_LLM_PROVIDER: ${DISCOVERY_LLM_PROVIDER:-mock}
      DISCOVERY_LLM_MODEL: ${DISCOVERY_LLM_MODEL:-}
      DISCOVERY_LLM_REASONING_EFFORT: ${DISCOVERY_LLM_REASONING_EFFORT:-low}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      DISCOVERY_MAX_QUESTIONS: ${DISCOVERY_MAX_QUESTIONS:-14}
      CONSULTATION_TOKEN_SECRET: ${CONSULTATION_TOKEN_SECRET:-development-only-secret-change-me}
      CONSULTATION_TOKEN_TTL_SECONDS: ${CONSULTATION_TOKEN_TTL_SECONDS:-2592000}
      WORKSPACE_API_KEY: ${WORKSPACE_API_KEY:-development-workspace-key-change-me}
      AUTOMATION_PROVIDER: ${AUTOMATION_PROVIDER:-disabled}
      AUTOMATION_WEBHOOK_URL: ${AUTOMATION_WEBHOOK_URL:-}
      AUTOMATION_WEBHOOK_SECRET: ${AUTOMATION_WEBHOOK_SECRET:-}
      AUTOMATION_TIMEOUT_SECONDS: ${AUTOMATION_TIMEOUT_SECONDS:-5}
      AUTOMATION_MAX_RETRIES: ${AUTOMATION_MAX_RETRIES:-2}
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
      WORKSPACE_API_KEY: ${WORKSPACE_API_KEY:-development-workspace-key-change-me}
      WORKSPACE_BASIC_USERNAME: ${WORKSPACE_BASIC_USERNAME:-koto}
      WORKSPACE_BASIC_PASSWORD: ${WORKSPACE_BASIC_PASSWORD:-development-workspace-password-change-me}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
